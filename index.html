<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroPHP - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .contenedor-general {
            display: flex;
            width: 90%;
            max-width: 900px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            border-radius: 10px;
            overflow: hidden;
        }
        .lado-izquierdo {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 40%;
            min-height: 500px;
        }
        .lado-izquierdo h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .lado-izquierdo p {
            font-size: 1.1em;
            margin-bottom: 20px;
            opacity: 0.9;
        }
        .lado-derecho {
            background: white;
            padding: 40px;
            width: 60%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
        }
        .tab-button {
            background: none;
            border: none;
            padding: 15px 30px;
            font-size: 1em;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            color: #666;
        }
        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        .tab-button:hover {
            color: #667eea;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .form-row {
            display: flex;
            gap: 15px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .boton-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }
        .boton-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .info-message {
            background: #d1ecf1;
            color: #0c5460;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        .info-message.show {
            display: block;
        }
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        @media (max-width: 768px) {
            .contenedor-general {
                flex-direction: column;
                width: 100%;
                border-radius: 0;
            }
            .lado-izquierdo {
                width: 100%;
                min-height: auto;
                padding: 30px;
            }
            .lado-derecho {
                width: 100%;
                padding: 30px;
            }
            .lado-izquierdo h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-general">
        <div class="lado-izquierdo">
            <h1>AeroPHP</h1>
            <p>Tu plataforma de reserva de vuelos</p>
            <p>Inicia sesión como cliente o empleado para acceder a nuestros servicios de reserva y gestión de vuelos.</p>
        </div>
        <div class="lado-derecho">
            <div class="tab-buttons">
                <button class="tab-button active" onclick="cambiarTab('login')">Iniciar Sesión</button>
                <button class="tab-button" onclick="cambiarTab('registro')">Registrarse</button>
            </div>

            <!-- TAB: LOGIN -->
            <div id="login" class="tab-content active">
                <div class="error-message" id="errorLogin"></div>
                <div class="info-message" id="infoLogin"></div>
                <form id="formulario-login" method="post" action="auth.php" onsubmit="return validarLogin()">
                    <input type="hidden" name="accion" value="login">
                    
                    <div class="form-group">
                        <label for="login-correo">Correo Electrónico:</label>
                        <input type="email" id="login-correo" name="correo" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="login-password">Contraseña:</label>
                        <input type="password" id="login-password" name="password" required>
                    </div>
                    
                    <button type="submit" class="boton-submit">Iniciar Sesión</button>
                </form>
            </div>

            <!-- TAB: REGISTRO -->
            <div id="registro" class="tab-content">
                <div class="error-message" id="errorRegistro"></div>
                <div class="success-message" id="successRegistro"></div>
                <div class="info-message" id="infoRegistro">Solo para clientes. Los empleados se registran en el sistema administrativo.</div>
                <form id="formulario-registro" method="post" action="auth.php" onsubmit="return validarRegistro()">
                    <input type="hidden" name="accion" value="registro">
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="reg-nombre">Nombre:</label>
                            <input type="text" id="reg-nombre" name="nombre" required>
                        </div>
                        <div class="form-group">
                            <label for="reg-apaterno">Apellido Paterno:</label>
                            <input type="text" id="reg-apaterno" name="a_paterno" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="reg-amaterno">Apellido Materno:</label>
                        <input type="text" id="reg-amaterno" name="a_materno" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="reg-fecha">Fecha de Nacimiento:</label>
                        <input type="date" id="reg-fecha" name="fecha_nac" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="reg-correo">Correo Electrónico:</label>
                        <input type="email" id="reg-correo" name="correo" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="reg-password">Contraseña:</label>
                        <input type="password" id="reg-password" name="password" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="reg-password-confirm">Confirmar Contraseña:</label>
                        <input type="password" id="reg-password-confirm" name="password_confirm" required>
                    </div>
                    
                    <button type="submit" class="boton-submit">Registrarse</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function cambiarTab(tab) {
            // Ocultar todos los tabs
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(el => el.classList.remove('active'));
            
            // Mostrar el tab seleccionado
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
        }

        function validarLogin() {
            const correo = document.getElementById('login-correo').value.trim();
            const password = document.getElementById('login-password').value;
            const errorDiv = document.getElementById('errorLogin');

            if (!correo || !password) {
                mostrarError('errorLogin', 'Por favor completa todos los campos');
                return false;
            }

            return true;
        }

        function validarRegistro() {
            const nombre = document.getElementById('reg-nombre').value.trim();
            const apaterno = document.getElementById('reg-apaterno').value.trim();
            const amaterno = document.getElementById('reg-amaterno').value.trim();
            const fecha = document.getElementById('reg-fecha').value;
            const correo = document.getElementById('reg-correo').value.trim();
            const password = document.getElementById('reg-password').value;
            const passwordConfirm = document.getElementById('reg-password-confirm').value;
            const errorDiv = document.getElementById('errorRegistro');

            if (!nombre || !apaterno || !amaterno || !fecha || !correo || !password || !passwordConfirm) {
                mostrarError('errorRegistro', 'Por favor completa todos los campos');
                return false;
            }

            if (password !== passwordConfirm) {
                mostrarError('errorRegistro', 'Las contraseñas no coinciden');
                return false;
            }

            if (password.length < 4) {
                mostrarError('errorRegistro', 'La contraseña debe tener al menos 4 caracteres');
                return false;
            }

            const hoy = new Date();
            const fechaNacimiento = new Date(fecha);
            const edad = hoy.getFullYear() - fechaNacimiento.getFullYear();

            if (edad < 18) {
                mostrarError('errorRegistro', 'Debes ser mayor de 18 años para registrarte');
                return false;
            }

            return true;
        }

        function mostrarError(elementId, mensaje) {
            const errorDiv = document.getElementById(elementId);
            errorDiv.textContent = mensaje;
            errorDiv.classList.add('show');
        }

        // Verificar si hay parámetro de error en la URL
        const params = new URLSearchParams(window.location.search);
        const error = params.get('error');
        const mensaje = params.get('mensaje');

        if (error) {
            mostrarError('errorLogin', decodeURIComponent(error));
        }

        if (mensaje && params.get('tipo') === 'success') {
            const successDiv = document.getElementById('successRegistro');
            successDiv.textContent = decodeURIComponent(mensaje);
            successDiv.classList.add('show');
            cambiarTab('login');
        }
    </script>
</body>
</html>
